[pytest]
testpaths = tests/test_cases
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --html=reports/test_report.html
    --self-contained-html
markers =
    smoke: Smoke tests - critical path validation
    regression: Regression tests - comprehensive validation
    negative: Negative tests - error handling and edge cases
